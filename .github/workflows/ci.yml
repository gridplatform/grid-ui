name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      # .env is gitignored; production build requires it (same defaults as .env.example)
      - run: cp .env.example .env
      - run: npm run build
      - run: npm test
